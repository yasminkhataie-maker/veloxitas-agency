<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="sphere" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#2be3ab"/>
      <stop offset="40%" stop-color="#0f6a5b"/>
      <stop offset="78%" stop-color="#053b32"/>
      <stop offset="100%" stop-color="#021613"/>
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="80%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="96%" stop-color="#7dffce" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#7dffce" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1fae83" stop-opacity="0.6"/>
      <stop offset="55%" stop-color="#1fae83" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1fae83" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="specular" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sphereClip2"><circle cx="300" cy="300" r="280"/></clipPath>
  </defs>

  <circle cx="300" cy="300" r="378.0" fill="url(#glow)"/>
  <circle cx="300" cy="300" r="280" fill="url(#sphere)"/>

  <g clip-path="url(#sphereClip2)">
    <rect x="0" y="0" width="600" height="600" fill="url(#sheen)"/>
    <ellipse cx="205" cy="165" rx="150" ry="105" fill="url(#specular)"/>
    <ellipse cx="440" cy="430" rx="60" ry="34" fill="#ffffff" opacity="0.08"/>
  </g>

  <circle cx="300" cy="300" r="280" fill="url(#rim)"/>
  <circle cx="300" cy="300" r="279" fill="none" stroke="#bfffe8" stroke-width="1.4" opacity="0.55"/>
  <ellipse cx="210" cy="190" rx="34" ry="20" fill="#ffffff" opacity="0.55" transform="rotate(-28 210 190)"/>
